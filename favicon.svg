<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff477e"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  
  <!-- macOS App Icon Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Letter K in Bold Modern Sans -->
  <text x="21" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-1">K</text>
  
  <!-- Accent Pink Brand Dot (Matching KUPETS.STUDIO) -->
